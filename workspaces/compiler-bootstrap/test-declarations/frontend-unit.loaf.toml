# Complete frontend unit-root dependency contract, including its development-only Rust inspection fixtures.
[project]
name = "incan-frontend-native-unit-tests"
version = "0.6.0-dev.6"
private = true

[project.features]
default = ["rust_inspect", "std_testing", "std_async", "std_decorators"]
rust_inspect = []
std_testing = []
std_async = []
std_decorators = []

[dependencies]
hex = { loaf = "crates-io/hex", version = "0.4.3" }
incan_format = { loaf = "incan_format", path = "../../../loaves/compiler/incan_format" }
incan_lang = { loaf = "incan_lang", path = "../../../loaves/kernel/incan_lang" }
incan_semantics_core = { loaf = "incan_semantics_core", path = "../../../loaves/kernel/incan_semantics_core" }
incan_semantics_stdlib = { features = ["std_async", "std_decorators", "std_testing"], loaf = "incan_semantics_stdlib", path = "../../../loaves/compiler/incan_semantics_stdlib" }
incan_std_core = { loaf = "incan_std_core", path = "../../../loaves/stdlib/core" }
incan_syntax = { loaf = "incan_syntax", path = "../../../loaves/kernel/incan_syntax" }
incan_test_support = { loaf = "incan_test_support", path = "../../../loaves/compiler/incan_test_support" }
incan_vocab = { loaf = "incan_vocab", path = "../../../loaves/kernel/incan_vocab", version = "0.3.0" }
oven_model = { loaf = "oven_model", path = "../../../loaves/oven/oven_model", version = "0.6.0-dev.5" }
quote = { loaf = "crates-io/quote", version = "1.0" }
rust_inspect = { default-features = false, features = ["inspector", "test_fixtures"], loaf = "rust_inspect", path = "../../../loaves/compiler/rust_inspect" }
semver = { loaf = "crates-io/semver", version = "1.0.27" }
serde = { features = ["derive"], loaf = "crates-io/serde", version = "1.0" }
serde_json = { loaf = "crates-io/serde_json", version = "1.0" }
sha2 = { loaf = "crates-io/sha2", version = "0.10.9" }
syn = { features = ["full", "parsing", "printing"], loaf = "crates-io/syn", version = "2.0" }
tempfile = { loaf = "crates-io/tempfile", version = "3" }
thiserror = { loaf = "crates-io/thiserror", version = "2.0" }
toml = { loaf = "crates-io/toml", version = "0.9" }
tracing = { loaf = "crates-io/tracing", version = "0.1" }
wasmtime = { default-features = false, features = ["cranelift", "runtime", "std"], loaf = "crates-io/wasmtime", version = "36.0.17" }
wasmtime-wasi = { default-features = false, features = ["preview1"], loaf = "crates-io/wasmtime-wasi", version = "36.0.17" }
