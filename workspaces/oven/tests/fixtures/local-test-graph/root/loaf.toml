[project]
name='crates-io/root'
version='1.0.0'
[project.features]
default=['chosen']
chosen=['dep:leaf','leaf/extra']
[dependencies]
leaf={loaf='crates-io/leaf',path='../leaf',version='1',optional=true,default-features=false}
macros={loaf='crates-io/macros',path='../macro',version='1'}
absent={loaf='crates-io/absent',path='../absent',target='cfg(windows)'}
[envs.test.dependencies]
leaf={optional=false,features=['test-only']}
support={loaf='crates-io/support',path='../support',version='1'}
[rust]
type='lib'
