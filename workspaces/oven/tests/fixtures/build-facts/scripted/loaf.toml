[project]
name = "crates-io/scripted"
version = "1.0.0"

[project.features]
default = ["std"]
std = []

[rust]
type = "lib"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "std"]
cfg = ["fast_arithmetic=\"64\"", "has_neon"]
out = [{ name = "table.rs", path = "out/table.rs", digest = "sha256:ff0adc19232b0da24c8f6497962f28339804fc38c1080c513a69f9829fbae74c" }]
environment = [{ name = "SCRIPTED_TABLE", literal = "crc32" }, { name = "SCRIPTED_TABLES", out = "." }]
harvested-from = "evidence only"

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "std"]
cfg = ["fast_arithmetic=\"64\""]
