<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd0013-layers-title dd0013-layers-desc">
<title id="dd0013-layers-title">Layers: OS facilities, the platform, std and the engine</title>
<desc id="dd0013-layers-desc">At the bottom, OS and Rust facilities are reached through Incan interop; above them the platform provides the store substrate as an IncQL-DB profile, memory mapping with lifetime-safe views, durable I/O and publication ordering, IPC and peer identity, process control and groups, resource probes and tracing, each wrapping the facility below thinly; on top, std and the build engine are peers that both build on the platform, and std wraps the platform for users without reimplementing it.</desc>
