<text x="1096" y="432" class="dd13-n dd13-c">posix_spawn · setpgid · cgroups</text>
<text x="1096" y="450" class="dd13-s dd13-c">Rust std and crates via rust::</text>
<line x1="24" y1="504" x2="1256" y2="504" class="dd13-rule"/>
<text x="24" y="528" class="dd13-i">Guardrail: the platform wraps OS and Rust facilities thinly, through interop, and never reimplements them. Low level means precise and minimal, not homegrown.</text>
<text x="24" y="548" class="dd13-i">std wraps the platform for users and never carries a second implementation of a platform primitive.</text>
