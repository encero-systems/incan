<svg viewBox="0 0 1280 1208" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd0013-seq-title dd0013-seq-desc">
<title id="dd0013-seq-title">Request lifecycle on incan.engine/1</title>
<desc id="dd0013-seq-desc">A CLI negotiates a session, submits a request that is accepted and then captured into an immutable build epoch; a record worker prepares the stage by keyed reads; only for dirty or missing work the engine claims and rechecks, the worker evaluates or compiles natively and stages its result, and the engine publishes the shared result before selecting it for this caller; the CLI receives events and a complete reply with leased handles, pins the execution, launches the program and releases the pin; readers query bounded pages; cancel, resolve and drain or stop travel on the control lane at any time.</desc>
