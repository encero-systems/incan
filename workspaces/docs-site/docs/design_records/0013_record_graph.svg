<svg viewBox="0 0 1280 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd0013-graph-title dd0013-graph-desc">
<title id="dd0013-graph-title">Ranked record graph: one sweep with early cutoff, across Incan and Rust</title>
<desc id="dd0013-graph-desc">Record families are ranked by namespace in import order and then by phase: source revision, namespace and name slot, declaration source, signature, layout and default facets, checked body, Body IR, instance, plan function, codegen-unit membership and native unit. An edit to app.queue's source seeds its declaration, which recomputes the push_all signature to an equal value and stops there, so app.main's body, which reads only that signature, is not evaluated, and RFC 097's caller facet for push_all, read by the Rust unit native.ring, is reused. The push_all body and Body IR are recomputed once, and the Body IR's equal value stops propagation before plans, codegen units and native units. native.ring is Rust source in the same Loaf: its declaration and signature records, with the ownership facts duckborrowing needs, rank in the same graph as Incan's, and app.main's body reads the Ring.push signature directly; Rust bodies compile whole in rustc. Frozen std.collections facts are read but never recomputed. Beside each declaration sit its declaration text, doc record and position map, outside semantic identity. Evaluation, selection and observation records carry provenance, bindings and evidence beside the graph.</desc>
