<text x="144" y="440" class="dd13-i">An unchanged build has no seed: it reuses the prior result binding and opens no graph page.</text>
<text x="144" y="460" class="dd13-i">A changed read set with an equal value publishes new witnesses but dirties no consumer.</text>
<text x="144" y="480" class="dd13-i">Rust records rank in the same graph: a Rust body edit that leaves Ring.push's ownership facts equal re-checks no Incan caller.</text>
<text x="144" y="500" class="dd13-i">Rust calls push_all through its caller facet; the equal push_all signature leaves the facet and the Rust unit reused.</text>

