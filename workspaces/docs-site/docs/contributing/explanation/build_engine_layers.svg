<svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd0013-layers-title dd0013-layers-desc">
<title id="dd0013-layers-title">Layers: OS facilities, std.primitives, the platform, standard packages and the engine</title>
<desc id="dd0013-layers-desc">OS and Rust facilities sit at the bottom. The foundational std.primitives package uses those facilities through explicit interop and imports no other standard package. The platform depends only on std.primitives among standard packages. Every other standard package and the build engine sit above the platform.</desc>
