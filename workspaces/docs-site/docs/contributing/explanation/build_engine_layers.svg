<text x="336" y="76" class="dd13-n dd13-c">Other standard packages</text>
<text x="336" y="92" class="dd13-s dd13-c">std.fs · std.process · std.db · std.graph · std.async</text>
<rect x="656" y="52" width="584" height="52" rx="6" class="dd13-box"/>
<text x="948" y="76" class="dd13-n dd13-c">Build engine and compiler record service</text>
<text x="948" y="92" class="dd13-s dd13-c">Oven engine · record workers · readers · execution policy</text>
<rect x="48" y="168" width="1192" height="48" rx="6" class="dd13-store"/>
<text x="644" y="188" class="dd13-n dd13-c">incan_platform</text>
<text x="644" y="204" class="dd13-s dd13-c">store · mapping · durable I/O · IPC · process control · probes · tracing</text>
<rect x="48" y="296" width="1192" height="48" rx="6" class="dd13-focal"/>
<text x="644" y="316" class="dd13-n dd13-c">std.primitives</text>
<text x="644" y="332" class="dd13-s dd13-c">values · errors · traits · async mechanisms · vocabulary contracts</text>
<rect x="48" y="416" width="280" height="48" rx="6" class="dd13-ext"/>
<text x="188" y="436" class="dd13-n dd13-c">Memory and files</text>
<text x="188" y="452" class="dd13-s dd13-c">mmap · sync · rename · locks</text>
<rect x="344" y="416" width="280" height="48" rx="6" class="dd13-ext"/>
<text x="484" y="436" class="dd13-n dd13-c">Transport</text>
<text x="484" y="452" class="dd13-s dd13-c">sockets · pipes · peer identity</text>
<rect x="640" y="416" width="296" height="48" rx="6" class="dd13-ext"/>
<text x="788" y="436" class="dd13-n dd13-c">Processes and clocks</text>
<text x="788" y="452" class="dd13-s dd13-c">spawn · groups · limits · time</text>
<rect x="952" y="416" width="288" height="48" rx="6" class="dd13-ext"/>
<text x="1096" y="436" class="dd13-n dd13-c">Rust std and crates</text>
<text x="1096" y="452" class="dd13-s dd13-c">explicit native dependencies</text>
<line x1="24" y1="504" x2="1256" y2="504" class="dd13-rule"/>
<text x="24" y="528" class="dd13-i">Guardrail: std.primitives imports no other standard package; incan_platform imports no standard package except std.primitives.</text>
<text x="24" y="548" class="dd13-i">Higher-level packages compose these mechanisms and preserve compatibility through re-export, never through a second implementation.</text>
