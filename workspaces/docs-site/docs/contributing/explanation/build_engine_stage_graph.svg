<svg viewBox="0 0 1280 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd0013-stages-title dd0013-stages-desc">
<title id="dd0013-stages-title">Build engine stages and their order</title>
<desc id="dd0013-stages-desc">Compiler defect fixes come first, then the S1 durable record store, then the S2 subset of copy-on-write directory, scoped views and leases, mapped views, sealed-set admission and compaction with root collection; E1a proves the engine mechanics on hello with unit records and E1b moves hello to per-declaration records; a producer-map sub-design precedes E1b and E2, which also needs the S3 compiler record path; E3 adds Loaf admission and shared native units using S2 sealed sets, E4 the scheduler and memory discipline using S2 leases, E5 test, run and readers, E6 native incremental proof, and S4 distribution qualification joins E6 before E7 switches the default and removes the old engine.</desc>
<defs>
