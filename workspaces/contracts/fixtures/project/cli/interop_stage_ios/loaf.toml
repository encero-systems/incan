[project]
name = "interop_stage_ios"
version = "0.1.0"

[project.scripts]
main = "src/main.incn"

[interop.c]

[[interop.c.targets]]
target = "aarch64-apple-ios-sim"
sdk = { capability = "iphonesimulator" }
platform = { kind = "ios", deployment-target = "14.0" }
headers = ["interop/include/bridge.h"]

[[interop.c.targets.artifacts]]
name = "bridge_runtime"
kind = "bundled"
path = "interop/ios/libbridge_runtime.dylib"
runtime-name = "libbridge_runtime.dylib"
placement = "frameworks"
minimum-platform = "14.0"

[[interop.c.targets.artifacts]]
name = "foundation"
kind = "system"
capability = "apple.framework.Foundation"
