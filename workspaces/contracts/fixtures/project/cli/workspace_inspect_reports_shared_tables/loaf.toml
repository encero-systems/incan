[project]
name = "workspace_inspect_reports_shared_tables"
version = "0.1.0"

[project.scripts]
main = "src/main.incn"

[workspace]
members = ["app"]
exclude = ["scratch"]

[workspace.dependencies]
shared = { path = "." }
serde = { loaf = "crates-io/serde", version = "1", default-features = false }

[workspace.envs.ci]
env-vars = { CI = "1" }

[workspace.policy.release]
approval = "required"

[workspace.sources.internal]
url = "https://packages.example.test"
