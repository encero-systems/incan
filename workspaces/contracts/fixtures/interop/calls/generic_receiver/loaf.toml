[project]
name = "generic_receiver"
version = "0.1.0"

[project.scripts]
main = "src/main.incn"

[dependencies]
regex = { loaf = "crates-io/regex", version = "1" }
byteorder = { loaf = "crates-io/byteorder", version = "1", features = [], default-features = true }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "0.8", features = [], default-features = true }
rand = { loaf = "crates-io/rand", version = "0.8", features = [], default-features = true }
sha2 = { loaf = "crates-io/sha2", version = "0.10", features = [], default-features = true }
blake2 = { loaf = "crates-io/blake2", version = "0.10", features = [], default-features = true }
sha3 = { loaf = "crates-io/sha3", version = "0.10", features = [], default-features = true }
blake3 = { loaf = "crates-io/blake3", version = "1", features = [], default-features = true }
xxhash_rust = { loaf = "crates-io/xxhash-rust", version = "0.8", features = ["xxh3", "xxh32", "xxh64"], default-features = true }
