[package]
name = "incan_semantics_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared surface-semantics contracts and registry interfaces for the Incan compiler"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
incan_core = { path = "../incan_core" }
serde = { version = "1.0", features = ["derive"] }
# The wire encoding for the checked representation RFC 123 publishes. Already in the workspace graph through
# wasmtime and rust-analyzer, so making it direct adds no third-party code, licence surface, or build cost.
postcard = { version = "1.1", features = ["use-std"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
