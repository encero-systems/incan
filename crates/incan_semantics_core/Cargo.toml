[package]
name = "incan_semantics_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared surface-semantics contracts and registry interfaces for the Incan compiler"
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
incan_core = { path = "../incan_core" }
serde = { version = "1.0", features = ["derive"] }
# The wire encoding for the checked representation RFC 123 publishes. Already in the workspace graph through
# wasmtime and rust-analyzer, so making it direct adds no third-party code, licence surface, or build cost.
#
# `default-features = false` is load-bearing, not tidiness. Postcard's defaults pull `heapless`, whose 0.7 line
# depends on `atomic-polyfill` — unmaintained, RUSTSEC-2023-0089, with no safe upgrade available. The existing
# consumers in this graph take postcard without those defaults, so enabling them here would have been this change
# introducing an advisory the workspace had avoided. Only `use-std` is needed: this encodes to and from `Vec<u8>`
# in a hosted compiler, and none of the embedded allocation machinery applies.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
thiserror = "2.0"
sha2 = "0.10.9"
hex = "0.4.3"

[dev-dependencies]
serde_json = "1.0"
