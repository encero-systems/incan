[dependencies]
postcard = { default-features = false, features = ["use-std"], loaf = "crates-io/postcard", version = "1.1" }
serde = { features = ["derive"], loaf = "crates-io/serde", version = "1.0" }

[project]
description = "Shared language vocabulary and semantic helpers for the Incan compiler and runtime"
license = "Apache-2.0"
name = "incan_lang"
private = true
version = "0.6.0-dev.8"

[rust]
edition = "2024"
name = "incan_lang"
type = "lib"

[[rust.bin]]
name = "generate_lang_reference"
path = "src/bin/generate_lang_reference.rs"
