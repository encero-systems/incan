[dependencies]
ar_archive_writer = { loaf = "crates-io/ar_archive_writer", version = "=0.5.3" }
hex = { loaf = "crates-io/hex", version = "0.4.3" }
oven_model = { loaf = "oven_model", path = "../oven_model", version = "0.6.0-dev.5" }
serde = { features = ["derive"], loaf = "crates-io/serde", version = "1.0" }
serde_json = { loaf = "crates-io/serde_json", version = "1.0" }
sha2 = { loaf = "crates-io/sha2", version = "0.10.9" }
thiserror = { loaf = "crates-io/thiserror", version = "2.0" }
toml = { loaf = "crates-io/toml", version = "0.9" }

[project]
description = "Oven's receipts, build-unit identities and the bounded content-addressed store that keys on them"
license = "Apache-2.0"
name = "oven_store"
private = true
version = "0.6.0-dev.5"

[project.features]
test_support = []

[rust]
edition = "2024"
name = "oven_store"
type = "lib"
