[project]
name = "oven_release_stdlib"
version = "0.1.0"

# The release-version stdlib closure seals every registry-backed facade once per supported profile. It is both the
# compatible direct-rustc closure and its source-inspection authority; a separate source-only bake would duplicate
# this same Cargo resolution and compilation work.
#
# These declarations are the authored root intent the Rust policy engine settles the closure's features from. A
# package that a stdlib facet crate requests with features (`loaves/stdlib/*/rust/Cargo.toml`) must be declared
# here with the union of those requests, or the engine refuses the sealed graph: Cargo unifies the facets'
# requests, and policy sees only what is declared here.
[rust-dependencies]
axum = "0.8"
bitflags = "=1.3.2"
blake2 = "0.10"
blake3 = "1"
byteorder = "1"
bzip2 = "0.6"
crc32fast = "1"
encoding_rs = "0.8"
flate2 = "1"
hmac = { version = "0.12", features = ["reset"] }
inventory = "0.3"
libm = "0.2"
md5 = { package = "md-5", version = "0.10" }
rand = "0.8"
regex = "1"
rustix = { version = "1.1", features = ["fs"] }
semver = "=1.0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
snap = "1"
tempfile = "3"
# `std.async` and `std.web` request these tokio features through their facet crates.
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
toml_edit = { version = "0.25", features = ["parse", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
xxhash_rust = { package = "xxhash-rust", version = "0.8", features = ["xxh3", "xxh32", "xxh64"] }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
