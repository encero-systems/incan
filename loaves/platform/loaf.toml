[project]
name = "incan_platform"
version = "0.6.0-dev.8"
description = "The OS-facing layer below std: thin wrappers over OS and Rust facilities"

[build]
rust-edition = "2024"

[dependencies]
serde = { loaf = "crates-io/serde", version = "1.0", features = ["derive"], default-features = true }
serde_json = { loaf = "crates-io/serde_json", version = "1.0", default-features = true }
