[project]
name = "incan_platform"
version = "0.6.0-dev.8"
description = "The OS-facing layer below std: thin wrappers over OS and Rust facilities"

[rust]
name = "incan_platform_clock"
type = "lib"
edition = "2024"

[rust.source]
root = "rust"

[build]
rust-edition = "2024"

[dependencies]
libc = { loaf = "crates-io/libc", version = "0.2" }
rustix = { loaf = "crates-io/rustix", version = "1.1", features = ["fs"], default-features = true }
serde = { loaf = "crates-io/serde", version = "1.0", features = ["derive"], default-features = true }
serde_json = { loaf = "crates-io/serde_json", version = "1.0", default-features = true }
