[package]
name = "incan_format"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Incan source formatter"

[lib]
name = "incan_format"
path = "src/lib.rs"

[dependencies]
incan_core = { workspace = true }
incan_semantics_core = { workspace = true }
