[package]
name = "oven_loaf_dependencies"
version = "0.1.0"
edition = "2021"
publish = false

# This isolated manifest is a locked source inventory for the named legacy_cargo Loaf publisher. It is not a
# workspace member and is never available to ordinary Incan build, run, or test commands.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
bitflags = "=1.3.2"
serde_json = "1"
uuid = { version = "1.0", features = ["v4", "serde"] }
