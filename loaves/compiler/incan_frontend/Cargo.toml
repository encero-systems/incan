[package]
name = "incan_frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The Incan compiler frontend: parsed modules, symbols, the typechecker, Body IR and the provider contract"

[lib]
name = "incan_frontend"
path = "src/lib.rs"

[features]
# Mirrors the root crate's defaults without `cli`, so `cargo test -p incan_frontend` compiles the inspector-driven
# tests; the root selects features explicitly and never relies on these.
default = ["rust_inspect", "std_testing", "std_async", "std_decorators"]
lsp = []
std_testing = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_testing"]
std_async = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_async"]
std_decorators = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_decorators"]
rust_inspect = ["rust_inspect/inspector"]
test_support = ["dep:tempfile", "rust_inspect/test_fixtures"]

[dependencies]
incan_core = { path = "../../../crates/incan_core" }
incan_vocab = { path = "../../../crates/incan_vocab" }
incan_syntax = { path = "../../kernel/incan_syntax" }
incan_semantics_core = { path = "../../kernel/incan_semantics_core" }
incan_semantics_stdlib = { path = "../incan_semantics_stdlib", optional = true }
incan_format = { path = "../incan_format" }
oven_model = { path = "../../oven/oven_model" }
rust_inspect = { path = "../rust_inspect", default-features = false }
hex = "0.4.3"
quote = { workspace = true }
regex = "1"
semver = "1.0.27"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
syn = { workspace = true, features = ["printing"] }
thiserror = { workspace = true }
toml = "0.9"
tracing = { workspace = true }
wasmtime = { version = "36.0.14", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.14", default-features = false, features = ["preview1"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
rust_inspect = { path = "../rust_inspect", default-features = false, features = ["test_fixtures"] }
tempfile = "3"
