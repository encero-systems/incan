[package]
name = "incan_oven_facet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "What Oven learns about Incan: the compiler's identity and its provider facts, as Oven's hooks"

[lib]
name = "incan_oven_facet"
path = "src/lib.rs"

[dependencies]
incan_core = { workspace = true }
incan_frontend = { path = "../incan_frontend", default-features = false }
incan_provider = { path = "../incan_provider", default-features = false }
oven_model = { path = "../../oven/oven_model" }
oven_rustc = { path = "../../oven/oven_rustc" }
oven_store = { path = "../../oven/oven_store" }

[dev-dependencies]
tempfile = "3"
