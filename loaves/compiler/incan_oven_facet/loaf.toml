incan_lang = { loaf = "incan_lang", path = "../../kernel/incan_lang" }
incan_provider = { default-features = false, loaf = "incan_provider", path = "../incan_provider" }
oven_cargo_compat = { loaf = "oven_cargo_compat", path = "../../oven/oven_cargo_compat", version = "0.6.0-dev.5" }
