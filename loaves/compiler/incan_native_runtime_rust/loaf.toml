[project]
name = "incan_native_runtime_rust"
version = "0.6.0-dev.9"
private = true

[rust]
name = "incan_native_runtime_rs"
type = "lib"
edition = "2024"

[dependencies]
incan_lang = { loaf = "incan_lang", path = "../../kernel/incan_lang" }
incan_std_primitives = { loaf = "incan_stdlib_primitives", path = "../../stdlib/primitives" }
incan_std_async = { loaf = "incan_stdlib_async", path = "../../stdlib/async" }
incan_std_testing = { loaf = "incan_stdlib_testing", path = "../../stdlib/testing" }
incan_std_data = { loaf = "incan_stdlib_data", path = "../../stdlib/data" }
serde = { loaf = "crates-io/serde", version = "1.0", features = ["derive"] }
