[package]
name = "incan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The incan command: clap surface, terminal rendering, exit codes, the test runner"
publish = false

[lib]
name = "incan_cli"
path = "src/lib.rs"

[[bin]]
name = "incan"
path = "src/main.rs"

[features]
# The command line ships the stdlib semantics packs and Rust inspection the way the toolchain does; a ring crate built
# on its own selects them explicitly.
default = ["rust_inspect", "std_testing", "std_async", "std_decorators"]
rust_inspect = ["dep:rust_inspect", "rust_inspect/inspector", "incan_frontend/rust_inspect", "incan_provider/rust_inspect", "incan_driver/rust_inspect", "oven-cli/rust_inspect"]
std_testing = ["incan_frontend/std_testing", "incan_provider/std_testing", "incan_driver/std_testing", "oven-cli/std_testing"]
std_async = ["incan_frontend/std_async", "incan_provider/std_async", "incan_driver/std_async", "oven-cli/std_async"]
std_decorators = ["incan_frontend/std_decorators", "incan_provider/std_decorators", "incan_driver/std_decorators", "oven-cli/std_decorators"]

[dependencies]
incan_codegraph = { workspace = true }
incan_lang = { workspace = true }
incan_driver = { workspace = true, features = ["cli"] }
incan_format = { workspace = true }
incan_frontend = { workspace = true }
incan_oven_facet = { workspace = true }
incan_provider = { workspace = true }
incan_semantics_core = { workspace = true }
incan_syntax = { workspace = true }
incan_vocab = { workspace = true }
oven_model = { workspace = true }
oven_rustc = { workspace = true }
oven_store = { workspace = true }
oven-cli = { workspace = true }
rust_inspect = { workspace = true, optional = true }
clap = { version = "4.4", features = ["derive"] }
hex = "0.4.3"
semver = "1.0.27"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
tempfile = "3"
toml = "0.9"
toml_edit = { version = "0.25", features = ["parse", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The command tests reach the driver's test-only fixtures and lock-collection counters through its test_support feature.
incan_driver = { workspace = true, features = ["cli", "test_support"] }
incan_test_support = { workspace = true }
# Unix process-group cleanup for bounded subprocess regression tests.
libc = "0.2"
# Runtime crate used by std.io generated-project offline smoke tests.
byteorder = "1"
# Runtime crate used by std.uuid generated-project offline smoke tests.
rand = "0.8"
# Runtime crate used by supported Rust-interop example smoke tests. The compiler-suite foundation Loaf seals this
# exact feature closure so normal examples can inspect and link `rust::uuid` without a Cargo fallback.
uuid = { version = "1", features = ["v4", "serde"] }
# Runtime crate used by std.regex generated-project offline smoke tests.
regex = "1"
# Runtime crates used by std.compression generated-project offline smoke tests.
flate2 = "1"
zstd = "0.13"
bzip2 = "0.6"
xz2 = "0.1"
snap = "1"
# Runtime crate used by std.checksum generated-project offline smoke tests.
crc32fast = "1"
# Runtime crates used by std.hash generated-project offline smoke tests.
blake2 = "0.10"
blake3 = "1"
md5_010 = { package = "md-5", version = "0.10" }
sha1 = "0.10"
sha3 = "0.10"
# Runtime crate used by the std.hash HMAC smoke tests.
hmac = { version = "0.12", features = ["reset"] }
xxhash_rust = { package = "xxhash-rust", version = "0.8", features = ["xxh3", "xxh32", "xxh64"] }
wat = "1"

[package.metadata.cargo-udeps.ignore]
# `uuid` anchors the compiler-suite's supported `rust::uuid` smoke closure in Cargo.lock; it is consumed by the
# explicit compiler-suite publisher, not by the Rust test harness. The other runtime crates above are linked by
# the tests that name them.
development = ["uuid"]
