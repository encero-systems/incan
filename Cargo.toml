[workspace]
members = [
    "loaves/stdlib/core/rust",
    "loaves/stdlib/data/rust",
    "loaves/stdlib/async/rust",
    "loaves/stdlib/web/rust",
    "loaves/stdlib/testing/rust",
    "loaves/compiler/incan_driver",
    "loaves/compiler/incan_emit",
    "loaves/compiler/incan_format",
    "loaves/compiler/incan_frontend",
    "loaves/compiler/incan_ir",
    "loaves/compiler/incan_oven_facet",
    "loaves/compiler/incan_provider",
    "loaves/compiler/incan_semantics_stdlib",
    "loaves/compiler/incan_test_support",
    "loaves/toolchain/incan-cli",
    "loaves/toolchain/incan-lsp",
    "loaves/toolchain/oven-cli",
    "loaves/compiler/rust_inspect",
    "loaves/kernel/incan_codegraph",
    "loaves/kernel/incan_lang",
    "loaves/kernel/incan_semantics_core",
    "loaves/kernel/incan_syntax",
    "loaves/kernel/incan_vocab",
    "loaves/oven/oven_model",
    "loaves/oven/oven_rustc",
    "loaves/oven/oven_interop",
    "loaves/oven/oven_registry",
    "loaves/oven/oven_cargo_compat",
    "loaves/oven/oven_store",
    "loaves/stdlib/derive/incan_derive",
    "loaves/stdlib/derive/incan_web_macros",
]
exclude = ["target/incan"]
resolver = "2"

[patch.crates-io]
# `ra_ap_proc_macro_api` enables postcard's default `heapless-cas` feature even though it only
# needs postcard with `alloc`. That default feature pulls `heapless/cas`, which pulls the
# unmaintained `atomic-polyfill` crate tracked by issue #260. Keep this patch narrow and remove it
# when the upstream manifest disables postcard defaults.
ra_ap_proc_macro_api = { path = "loaves/third_party/ra_ap_proc_macro_api" }

[workspace.package]
version = "0.6.0-dev.5"
description = "The Incan programming language compiler"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Danny Meijer <dannys.code.corner@gmail.com>"]
repository = "https://github.com/encero-systems/incan"
homepage = "https://github.com/encero-systems/incan"
readme = "README.md"
keywords = ["programming-language", "compiler", "rust", "python"]
categories = ["compilers", "development-tools"]

# One version per shared dependency, declared once; members write `workspace = true` and add only the features they
# need on top. Every manifest the layout rewrite (#1478) writes starts from this table.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1"
tower-lsp = "0.20"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
thiserror = "2.0"
tracing = "0.1"
# Every workspace crate is named here once — its directory, its ring's version requirement where that ring has
# its own line, and `default-features = false` where any member consumes it without defaults — and members
# inherit the entry. The release archive and the staged SDK runtime write their own tables against `crates/<name>`.
incan_lang = { path = "loaves/kernel/incan_lang" }
incan_derive = { path = "loaves/stdlib/derive/incan_derive", version = "0.6.0-dev.5" }
incan_std_core = { path = "loaves/stdlib/core/rust", version = "0.6.0-dev.5" }
incan_std_data = { path = "loaves/stdlib/data/rust", version = "0.6.0-dev.5" }
incan_std_async = { path = "loaves/stdlib/async/rust", version = "0.6.0-dev.5" }
incan_std_web = { path = "loaves/stdlib/web/rust", version = "0.6.0-dev.5" }
incan_std_testing = { path = "loaves/stdlib/testing/rust", version = "0.6.0-dev.5" }
incan_vocab = { path = "loaves/kernel/incan_vocab", version = "0.3.0" }
incan_web_macros = { path = "loaves/stdlib/derive/incan_web_macros", version = "0.6.0-dev.5" }
incan_driver = { path = "loaves/compiler/incan_driver", default-features = false }
incan_emit = { path = "loaves/compiler/incan_emit", default-features = false }
incan_format = { path = "loaves/compiler/incan_format" }
incan_test_support = { path = "loaves/compiler/incan_test_support" }
incan-cli = { path = "loaves/toolchain/incan-cli" }
incan-lsp = { path = "loaves/toolchain/incan-lsp" }
oven-cli = { path = "loaves/toolchain/oven-cli" }
incan_frontend = { path = "loaves/compiler/incan_frontend", default-features = false }
incan_ir = { path = "loaves/compiler/incan_ir", default-features = false }
incan_oven_facet = { path = "loaves/compiler/incan_oven_facet" }
incan_provider = { path = "loaves/compiler/incan_provider", default-features = false }
incan_semantics_stdlib = { path = "loaves/compiler/incan_semantics_stdlib" }
rust_inspect = { path = "loaves/compiler/rust_inspect", default-features = false }
incan_codegraph = { path = "loaves/kernel/incan_codegraph" }
incan_semantics_core = { path = "loaves/kernel/incan_semantics_core" }
incan_syntax = { path = "loaves/kernel/incan_syntax" }
oven_model = { path = "loaves/oven/oven_model", version = "0.6.0-dev.5" }
oven_rustc = { path = "loaves/oven/oven_rustc", version = "0.6.0-dev.5" }
oven_interop = { path = "loaves/oven/oven_interop", version = "0.6.0-dev.5" }
oven_registry = { path = "loaves/oven/oven_registry", version = "0.6.0-dev.5" }
oven_cargo_compat = { path = "loaves/oven/oven_cargo_compat", version = "0.6.0-dev.5" }
oven_store = { path = "loaves/oven/oven_store", version = "0.6.0-dev.5" }

# The named, receipt-bound compatibility profile used only by Oven's explicit compiler-suite publisher. Normal
# `incan build`, `incan run`, and `incan test` consume the resulting direct-rustc Oven Loaf and never select this
# Cargo profile. Keep the settings mirrored by Oven's direct-rustc test runner so the transient publisher does not
# smuggle a different compilation contract into an immutable suite entry.
[profile.oven-test]
inherits = "dev"
debug = 0
incremental = false

# Oven's bounded publisher SHA-256-validates multi-gigabyte immutable closures. Leaving the digest core at dev
# opt-level 0 turns integrity verification into a many-minute CPU bottleneck even when Cargo compilation is already
# complete; optimize only this pure dependency while retaining debuggable compiler code.
[profile.dev.package.sha2]
opt-level = 3
