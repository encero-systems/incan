[workspace]
members = [
    ".",
    "loaves/stdlib/core/rust",
    "loaves/stdlib/data/rust",
    "loaves/stdlib/async/rust",
    "loaves/stdlib/web/rust",
    "loaves/stdlib/testing/rust",
    "loaves/compiler/incan_driver",
    "loaves/compiler/incan_emit",
    "loaves/compiler/incan_format",
    "loaves/compiler/incan_frontend",
    "loaves/compiler/incan_ir",
    "loaves/compiler/incan_oven_facet",
    "loaves/compiler/incan_provider",
    "loaves/compiler/incan_semantics_stdlib",
    "loaves/compiler/incan_test_support",
    "loaves/toolchain/incan-cli",
    "loaves/toolchain/incan-lsp",
    "loaves/compiler/rust_inspect",
    "loaves/kernel/incan_codegraph",
    "loaves/kernel/incan_core",
    "loaves/kernel/incan_semantics_core",
    "loaves/kernel/incan_syntax",
    "loaves/kernel/incan_vocab",
    "loaves/oven/oven_model",
    "loaves/oven/oven_rustc",
    "loaves/oven/oven_store",
    "loaves/stdlib/derive/incan_derive",
    "loaves/stdlib/derive/incan_web_macros",
]
exclude = ["target/incan"]
resolver = "2"

[patch.crates-io]
# `ra_ap_proc_macro_api` enables postcard's default `heapless-cas` feature even though it only
# needs postcard with `alloc`. That default feature pulls `heapless/cas`, which pulls the
# unmaintained `atomic-polyfill` crate tracked by issue #260. Keep this patch narrow and remove it
# when the upstream manifest disables postcard defaults.
ra_ap_proc_macro_api = { path = "loaves/third_party/ra_ap_proc_macro_api" }

[workspace.package]
version = "0.6.0-dev.4"
description = "The Incan programming language compiler"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Danny Meijer <dannys.code.corner@gmail.com>"]
repository = "https://github.com/encero-systems/incan"
homepage = "https://github.com/encero-systems/incan"
readme = "README.md"
keywords = ["programming-language", "compiler", "rust", "python"]
categories = ["compilers", "development-tools"]

# One version per shared dependency, declared once; members write `workspace = true` and add only the features they
# need on top. Every manifest the layout rewrite (#1478) writes starts from this table.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1"
tower-lsp = "0.20"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
thiserror = "2.0"
tracing = "0.1"
# Every workspace crate is named here once — its directory, its ring's version requirement where that ring has
# its own line, and `default-features = false` where any member consumes it without defaults — and members
# inherit the entry. The release archive and the staged SDK runtime write their own tables against `crates/<name>`.
incan_core = { path = "loaves/kernel/incan_core" }
incan_derive = { path = "loaves/stdlib/derive/incan_derive", version = "0.6.0-dev.4" }
incan_std_core = { path = "loaves/stdlib/core/rust", version = "0.6.0-dev.4" }
incan_std_data = { path = "loaves/stdlib/data/rust", version = "0.6.0-dev.4" }
incan_std_async = { path = "loaves/stdlib/async/rust", version = "0.6.0-dev.4" }
incan_std_web = { path = "loaves/stdlib/web/rust", version = "0.6.0-dev.4" }
incan_std_testing = { path = "loaves/stdlib/testing/rust", version = "0.6.0-dev.4" }
incan_vocab = { path = "loaves/kernel/incan_vocab", version = "0.3.0" }
incan_web_macros = { path = "loaves/stdlib/derive/incan_web_macros", version = "0.6.0-dev.4" }
incan_driver = { path = "loaves/compiler/incan_driver", default-features = false }
incan_emit = { path = "loaves/compiler/incan_emit", default-features = false }
incan_format = { path = "loaves/compiler/incan_format" }
incan_test_support = { path = "loaves/compiler/incan_test_support" }
incan-cli = { path = "loaves/toolchain/incan-cli" }
incan-lsp = { path = "loaves/toolchain/incan-lsp" }
incan_frontend = { path = "loaves/compiler/incan_frontend", default-features = false }
incan_ir = { path = "loaves/compiler/incan_ir", default-features = false }
incan_oven_facet = { path = "loaves/compiler/incan_oven_facet" }
incan_provider = { path = "loaves/compiler/incan_provider", default-features = false }
incan_semantics_stdlib = { path = "loaves/compiler/incan_semantics_stdlib" }
rust_inspect = { path = "loaves/compiler/rust_inspect", default-features = false }
incan_codegraph = { path = "loaves/kernel/incan_codegraph" }
incan_semantics_core = { path = "loaves/kernel/incan_semantics_core" }
incan_syntax = { path = "loaves/kernel/incan_syntax" }
oven_model = { path = "loaves/oven/oven_model", version = "0.6.0-dev.4" }
oven_rustc = { path = "loaves/oven/oven_rustc", version = "0.6.0-dev.4" }
oven_store = { path = "loaves/oven/oven_store", version = "0.6.0-dev.4" }

[package]
name = "incan"
version.workspace = true
license.workspace = true
edition.workspace = true  # Rust 2024 edition
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true
description.workspace = true
readme.workspace = true

[features]
default = ["rust_inspect", "std_testing", "std_async", "std_decorators"]
std_testing = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_testing", "incan_frontend/std_testing", "incan_ir/std_testing", "incan_emit/std_testing", "incan_provider/std_testing", "incan_driver/std_testing"]
std_async = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_async", "incan_frontend/std_async", "incan_ir/std_async", "incan_emit/std_async", "incan_provider/std_async", "incan_driver/std_async"]
std_decorators = ["dep:incan_semantics_stdlib", "incan_semantics_stdlib/std_decorators", "incan_frontend/std_decorators", "incan_ir/std_decorators", "incan_emit/std_decorators", "incan_provider/std_decorators", "incan_driver/std_decorators"]
# Rust dependency inspection via rust-analyzer (`ra_ap_*`) in the `rust_inspect` crate.
# Kept optional for non-CLI/library builds; the CLI enables it so ordinary `rust::` imports can preserve
# real function/type signatures.
rust_inspect = ["rust_inspect/inspector", "incan_frontend/rust_inspect", "incan_ir/rust_inspect", "incan_emit/rust_inspect", "incan_provider/rust_inspect", "incan_driver/rust_inspect"]

[dependencies]
# Shared language/semantic helpers (canonical vocab)
incan_core = { workspace = true }
incan_format = { workspace = true }
incan_frontend = { workspace = true }
incan_ir = { workspace = true }
incan_emit = { workspace = true }
incan_provider = { workspace = true }
incan_driver = { workspace = true }
incan_oven_facet = { workspace = true }
incan_codegraph = { workspace = true }
incan_vocab = { workspace = true }
# Shared syntax frontend (lexer, parser, AST, diagnostics)
incan_syntax = { workspace = true }
# Shared semantics backend (type checker, semantic analysis)
incan_semantics_core = { workspace = true }
incan_semantics_stdlib = { workspace = true, optional = true }

# JSON serialization (for LSP protocol)
serde_json = { workspace = true }

# CLI parsing with typed subcommands
# Already a dev-dependency below. The direct-rustc reuse path publishes a verified copy of a retained output through
# a uniquely named sibling, so it needs the same crate at runtime under `cli`.
tempfile = "3"
# Composable error types
thiserror = { workspace = true }

# AST-based Rust code generation
syn = { workspace = true, features = ["printing"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
# Code formatting for generated Rust
prettyplease = "0.2"
tracing = { workspace = true }

# TOML parsing for loaf.toml manifests (RFC 013/023)
toml = "0.9"
# Span-preserving TOML parsing for manifest diagnostics.
toml_edit = { version = "0.25", features = ["parse", "serde"] }
# Serde derive for manifest deserialization
serde = { workspace = true }
sha2 = "0.10.9"
sha1 = "0.10"
# Keyed MAC primitives for std.hash (#1075); 0.12 is the line matching digest 0.10.
hmac = { version = "0.12", features = ["reset"] }
hex = "0.4.3"
semver = "1.0.27"
oven_model = { workspace = true }
oven_rustc = { workspace = true }
oven_store = { workspace = true }
globset = "0.4.18"
# Safe, capability-oriented filesystem primitives for no-replace Oven publications.
rustix = { version = "1.1.4", features = ["fs"] }
rust_inspect = { workspace = true }
# WASM runtime for desugarer packaging
# 36.0.14 is the patched RUSTSEC-2026-0222/RUSTSEC-2026-0269 line compatible with Incan's Rust 1.93 MSRV.
# Wasmtime 45 remains vulnerable, while the patched 46.0.2 release requires Rust 1.94.
wasmtime = { version = "36.0.14", default-features = false, features = ["cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "36.0.14", default-features = false, features = ["preview1"] }

[dev-dependencies]
# The harness every integration-test root shares: checkout anchors, the compiler subprocess, fixture builders.
incan_test_support = { workspace = true }
# Artifact-level `incan-v1` conformance decodes the pinned toolchain's v0 symbols independently of compiler state.
rustc-demangle = "0.1.27"
# Runtime crate for parity tests
incan_std_core = { workspace = true }
# Temporary directories for manifest discovery tests
incan_frontend = { workspace = true, features = ["test_support"] }
incan_emit = { workspace = true, features = ["test_support"] }
incan_provider = { workspace = true, features = ["test_support"] }
incan_driver = { workspace = true, features = ["test_support"] }
rust_inspect = { workspace = true, features = ["test_fixtures"] }
oven_rustc = { workspace = true, features = ["test_support"] }
oven_store = { workspace = true, features = ["test_support"] }
tempfile = "3"

[package.metadata.cargo-udeps.ignore]
# `regex` deliberately anchors generated std.regex consumers in Cargo.lock for offline test shards; the Rust test
# harness does not link it directly.
# `uuid` likewise anchors the compiler-suite's supported `rust::uuid` smoke closure; it is consumed by the explicit
# legacy publisher, not by the Rust test harness.
development = ["regex", "uuid"]

# The named, receipt-bound compatibility profile used only by Oven's explicit compiler-suite publisher. Normal
# `incan build`, `incan run`, and `incan test` consume the resulting direct-rustc Oven Loaf and never select this
# Cargo profile. Keep the settings mirrored by Oven's direct-rustc test runner so the transient publisher does not
# smuggle a different compilation contract into an immutable suite entry.
[profile.oven-test]
inherits = "dev"
debug = 0
incremental = false

# Oven's bounded publisher SHA-256-validates multi-gigabyte immutable closures. Leaving the digest core at dev
# opt-level 0 turns integrity verification into a many-minute CPU bottleneck even when Cargo compilation is already
# complete; optimize only this pure dependency while retaining debuggable compiler code.
[profile.dev.package.sha2]
opt-level = 3

[lib]
name = "incan"
path = "src/lib.rs"
