name: Release qualification

# Every full qualification builds and verifies this checkout's compiler from the checked-in released seed, then runs
# the byte-for-byte fixed-point rebuild. Stacked PRs use stack_checks.yml.
on:
  push:
    branches: [main, release/**]
    tags: ['v*']
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      INCAN_STDLIB: ${{ github.workspace }}/loaves/stdlib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore release caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/incan-build-toolchain/cache/release-reference
            ${{ runner.temp }}/incan-build-toolchain/cache/release-rust
          key: release-v1-${{ matrix.target }}-${{ hashFiles('build-toolchain.json') }}-${{ github.sha }}
          restore-keys: release-v1-${{ matrix.target }}-${{ hashFiles('build-toolchain.json') }}-
      - name: Install the released build seed
        uses: ./.github/actions/install-build-toolchain
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # A tag's release is stamped with scripts/release-signer.json, and a stamped incan installs only what the sign job
      # signed, so a tag's run packs here and leaves installed verification to the verify job. Every other run is
      # unstamped and runs every phase here.
      - name: Build, verify and reproduce the checkout release
        run: >-
          incan run scripts/release.incn -- "$GITHUB_SHA" "$RUNNER_TEMP/release" --prove-fixed-point
          --jobs 6 --timeout 600 ${{ startsWith(github.ref, 'refs/tags/v') && '--stamp-signer' || '' }}
      - name: Retain the bundle a tag signs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/release/bundle
          if-no-files-found: error
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release/**/*.diff
            ${{ runner.temp }}/release/**/*.json
            ${{ runner.temp }}/release/**/*.log
            ${{ runner.temp }}/release/**/*.sha256
            ${{ runner.temp }}/release/**/*.tsv
            ${{ runner.temp }}/release/**/*.txt
          if-no-files-found: warn

  # DD-0016: every release asset is signed keylessly from this workflow's own identity, in the one job that holds the
  # token. It checks nothing out and runs nothing the release built: only cosign. Only a tag is a release, so
  # the certificate names this file at `refs/tags/<tag>`, which is the signer an installed toolchain carries. Moving
  # or renaming this file changes that identity, and needs a signed release that states the new one first.
  sign:
    name: Sign (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the qualified bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-${{ matrix.target }}
          path: bundle
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.5
      - name: Sign each asset with this workflow's identity
        working-directory: bundle
        run: |
          for asset in toolchain.tar.zst incan incan-lsp; do
            cosign sign-blob --yes --new-bundle-format --bundle "$asset.sigstore.json" "$asset"
          done
      - name: Verify each signature against the identity releases carry
        working-directory: bundle
        env:
          SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for asset in toolchain.tar.zst incan incan-lsp; do
            cosign verify-blob --new-bundle-format --bundle "$asset.sigstore.json" \
              --certificate-identity "$SIGNER" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$asset"
          done
      - name: Retain the signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-bundle-${{ matrix.target }}
          path: bundle
          if-no-files-found: error

  # The stamped incan installs the bundle the sign job signed, verifying each signature against the signer it carries,
  # and the installed toolchain then passes the release's installed verification.
  verify:
    name: Verify the signed release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: sign
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      INCAN_STDLIB: ${{ github.workspace }}/loaves/stdlib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore release caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/incan-build-toolchain/cache/release-reference
            ${{ runner.temp }}/incan-build-toolchain/cache/release-rust
          key: release-v1-${{ matrix.target }}-${{ hashFiles('build-toolchain.json') }}-${{ github.sha }}
          restore-keys: release-v1-${{ matrix.target }}-${{ hashFiles('build-toolchain.json') }}-
      - name: Install the released build seed
        uses: ./.github/actions/install-build-toolchain
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/signed
      # An artifact keeps no file modes; the signatures cover the bytes.
      - name: Make the signed programs executable
        run: chmod +x "$RUNNER_TEMP/signed/incan" "$RUNNER_TEMP/signed/incan-lsp"
      - name: Install the signed bundle with its stamped incan and verify the installation
        run: >-
          incan run scripts/release.incn -- "$GITHUB_SHA" "$RUNNER_TEMP/release"
          --verify-installed "$RUNNER_TEMP/signed" --jobs 6 --timeout 600
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verified-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release/**/*.diff
            ${{ runner.temp }}/release/**/*.json
            ${{ runner.temp }}/release/**/*.log
            ${{ runner.temp }}/release/**/*.sha256
            ${{ runner.temp }}/release/**/*.tsv
            ${{ runner.temp }}/release/**/*.txt
          if-no-files-found: warn

  docs:
    name: US English and strict docs
    runs-on: ubuntu-latest
    env:
      INCAN_STDLIB: ${{ github.workspace }}/loaves/stdlib
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the build toolchain
        uses: ./.github/actions/install-build-toolchain
        with:
          target: x86_64-unknown-linux-gnu
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check US English
        run: incan run scripts/check_us_english.incn
      - name: Install docs dependencies
        run: python -m pip install -r workspaces/docs-site/requirements-docs.txt
      - name: Build strict docs
        run: make docs
