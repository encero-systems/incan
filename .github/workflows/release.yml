name: Release qualification

# Full qualification builds this checkout's compiler from the checked-in released seed. Stacked PRs use
# stack_checks.yml; the release workflow enables the fixed-point flag once the reproducibility stage lands.
on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the released build seed
        uses: ./.github/actions/install-build-toolchain
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify the checkout release
        run: >-
          incan run scripts/release.incn -- "$GITHUB_SHA" "$RUNNER_TEMP/release"
          --jobs 6 --timeout 600
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/release/**/*.diff
            ${{ runner.temp }}/release/**/*.json
            ${{ runner.temp }}/release/**/*.log
            ${{ runner.temp }}/release/**/*.sha256
            ${{ runner.temp }}/release/**/*.tsv
            ${{ runner.temp }}/release/**/*.txt
          if-no-files-found: warn

  docs:
    name: US English and strict docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the build toolchain
        uses: ./.github/actions/install-build-toolchain
        with:
          target: x86_64-unknown-linux-gnu
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check US English
        run: incan run scripts/check_us_english.incn
      - name: Install docs dependencies
        run: python -m pip install -r workspaces/docs-site/requirements-docs.txt
      - name: Build strict docs
        run: make docs
