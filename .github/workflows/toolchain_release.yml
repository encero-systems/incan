name: Incan Toolchain Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-toolchain:
    name: Package toolchain (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned deliberately: the packaged binary is dynamically linked against the build machine's glibc, so
          # the runner chooses the oldest Linux this release can run on. `ubuntu-latest` (24.04) produced a
          # binary requiring GLIBC_2.39, which cannot start on Ubuntu 22.04 LTS (2.35), Debian 12 (2.36), RHEL 9
          # or Amazon Linux 2023 -- most production Linux. Raise this only with a matching support decision.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip1,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-${{ matrix.target }}
          cache-workspace-crates: "true"
      - name: Build host stdlib artifact builder
        run: cargo build --locked --release --bin incan
      - name: Build toolchain commands
        run: cargo build --locked --release --features lsp --target "${{ matrix.target }}" --bin incan --bin incan-lsp
      # package_archive.sh derives the release support workspace lock with `cargo metadata --offline`,
      # which requires every crate named by the support workspace and release_stdlib fixture to already
      # be in the registry cache. Ordinary workspace builds do not guarantee that, and runner caches
      # evict between releases, so warm the cache explicitly while network access is still expected.
      - name: Prewarm release support workspace registry cache
        run: workspaces/release/toolchain/fetch_release_support_workspace_sources.sh
      - name: Package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          INCAN_BIN: target/${{ matrix.target }}/release/incan
          INCAN_LSP_BIN: target/${{ matrix.target }}/release/incan-lsp
          INCAN_STDLIB_ARTIFACT_BUILDER_BIN: target/release/incan
        run: workspaces/release/toolchain/package_archive.sh "${TARGET}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: incan-toolchain-${{ matrix.target }}
          path: |
            incan-*.tar.gz
            incan-*.tar.gz.sha256
            toolchain-version.txt
            toolchain-release.txt
            rust-channel-*.txt
          if-no-files-found: error

  publish-toolchain:
    name: Publish toolchain manifest and archives
    runs-on: ubuntu-latest
    needs: package-toolchain
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: incan-toolchain-*
          path: dist/toolchain
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-publish
          cache-workspace-crates: "true"
      - name: Bootstrap packaged Incan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/toolchain-bootstrap
          tar -xzf dist/toolchain/incan-*-x86_64-unknown-linux-gnu.tar.gz -C dist/toolchain-bootstrap
          dist/toolchain-bootstrap/bin/incan --version
      - name: Write release manifest
        shell: bash
        env:
          INCAN_REPO_ROOT: ${{ github.workspace }}
          INCAN_TOOLCHAIN_DIST_DIR: ${{ github.workspace }}/dist/toolchain
        run: |
          set -euo pipefail
          INCAN_TOOLCHAIN_GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export INCAN_TOOLCHAIN_GENERATED_AT
          dist/toolchain-bootstrap/bin/incan run workspaces/release/toolchain/prepare_assets.incn
      - name: Package npm installer
        run: node workspaces/release/npm/prepare_package.js dist/toolchain
      - name: Package Python installer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build hatchling
          python3 workspaces/release/pip/prepare_package.py dist/toolchain
      - name: Smoke generated toolchain installers
        shell: bash
        env:
          TOOLCHAIN_DIST: ${{ github.workspace }}/dist/toolchain
          TOOLCHAIN_HOST_TARGET: x86_64-unknown-linux-gnu
          TOOLCHAIN_INCAN_BIN: dist/toolchain-bootstrap/bin/incan
        run: |
          set -euo pipefail
          bash workspaces/release/toolchain/local_smoke.sh direct
          bash workspaces/release/toolchain/local_smoke.sh npm
          bash workspaces/release/toolchain/local_smoke.sh pip
          bash workspaces/release/toolchain/local_smoke.sh homebrew
      - name: Upload toolchain assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: |
            dist/toolchain/incan-*.tar.gz
            dist/toolchain/incan-*.tar.gz.sha256
            dist/toolchain/manifest.json
            dist/toolchain/toolchain-manifest.schema.v1.json
            dist/toolchain/install.sh
            dist/toolchain/incan.rb
            dist/toolchain/toolchain-version.txt
            dist/toolchain/incan-toolchain-*.tgz
            dist/toolchain/incan-*.whl
            dist/toolchain/incan-[0-9]*.tar.gz
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease --latest=false
          else
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false --latest
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: incan-toolchain-manifest
          path: |
            dist/toolchain/manifest.json
            dist/toolchain/toolchain-manifest.schema.v1.json
            dist/toolchain/toolchain-version.txt
            dist/toolchain/install.sh
            dist/toolchain/incan.rb
            dist/toolchain/incan-toolchain-*.tgz
            dist/toolchain/incan-*.whl
            dist/toolchain/incan-[0-9]*.tar.gz
          if-no-files-found: error

  publish-npm:
    name: Publish npm installer package
    runs-on: ubuntu-latest
    needs: publish-toolchain
    if: startsWith(github.ref, 'refs/tags/')
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: incan-toolchain-manifest
          path: dist/toolchain
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish npm toolchain packages
        shell: bash
        run: |
          set -euo pipefail
          npm_tag="latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            npm_tag="rc"
          fi
          version="$(sed -n '1p' dist/toolchain/toolchain-version.txt | tr -d '\r\n')"
          # The npm package is a reference shim that provisions the verified release archive on first invocation;
          # no per-platform payload packages exist (a ~200MB toolchain payload exceeds npm's upload limits).
          npm publish "dist/toolchain/incan-toolchain-${version}.tgz" --access public --provenance --tag "$npm_tag"

  publish-pypi:
    name: Publish Python installer package
    runs-on: ubuntu-latest
    needs: publish-toolchain
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: incan-toolchain-manifest
          path: dist/toolchain
      - name: Stage PyPI distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pypi
          cp dist/toolchain/incan-*.whl dist/toolchain/incan-[0-9]*.tar.gz dist/pypi/
      - name: Publish Python installer package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pypi
          skip-existing: true
