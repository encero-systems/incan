name: dev.8 installed toolchain

# Set DEV8_TOOLCHAINS only after the real release passes its self-hosting gate.
# Its JSON maps each target triple to a GHCR tag@sha256:digest (publisher output).
on:
  push:
    branches: [main, '*.*.*-dev.*', release/**]
  pull_request:
    branches: [main, '*.*.*-dev.*', release/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dev8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Require a pinned release bundle
        env:
          TOOLCHAIN_REF: ${{ fromJSON(vars.DEV8_TOOLCHAINS || '{}')[matrix.target] }}
        run: test -n "$TOOLCHAIN_REF"
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0
      - name: Authenticate for the release bundle
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Install and verify dev.8
        env:
          TOOLCHAIN_REF: ${{ fromJSON(vars.DEV8_TOOLCHAINS || '{}')[matrix.target] }}
          CI_DEV8_OUT: ${{ runner.temp }}/dev8
        run: scripts/ci-dev8.sh "$TOOLCHAIN_REF"
      - name: Retain installation and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev8-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dev8/run.*/*.txt
            ${{ runner.temp }}/dev8/run.*/*.log
            ${{ runner.temp }}/dev8/run.*/*.sha256
            ${{ runner.temp }}/dev8/run.*/*.json
          if-no-files-found: warn

  docs:
    name: US English and strict docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check US English
        run: make us-english-check
      - name: Install docs dependencies
        run: python -m pip install -r workspaces/docs-site/requirements-docs.txt
      - name: Build strict docs
        run: make docs-build
