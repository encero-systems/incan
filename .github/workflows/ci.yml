name: CI

# Full CI runs on main, on release branches and on the development line's pull request into main. Stacked PRs get
# stack_checks.yml instead.

# Steps that run `incan` install the pinned dev.8 release bundle (BUILD_TOOLCHAIN) with Rust 1.98.0 and rustc-dev
# through .github/actions/install-build-toolchain (DD-0010); the job fails while no bundle is pinned for its host.

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INCAN_NO_BANNER: 1

jobs:
  hygiene:
    name: Checkout hygiene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install nightly rustfmt
        uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: git ls-files -z 'loaves/*.rs' ':!:loaves/**/fixtures/**' | xargs -0 rustfmt +nightly --edition 2024 --config skip_children=true --check
      - name: Install dev.8
        uses: ./.github/actions/install-build-toolchain
        with:
          reference: ${{ fromJSON(vars.BUILD_TOOLCHAIN || '{}')['x86_64-unknown-linux-gnu'] }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          incan run scripts/check_changed_rustdocs.incn -- --base "$base_ref"
      - name: Check US English
        run: incan run scripts/check_us_english.incn
      - name: Check the AGENTS.md skill table
        run: incan run scripts/check_agents_doc_sync.incn
