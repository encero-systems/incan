name: CI

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main, release/** ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INCAN_NO_BANNER: 1

jobs:
  changes:
    name: CI Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Classify the pull request
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            base_ref="origin/$BASE_REF"
            changed=false
            docs_only=true

            while IFS= read -r -d '' file; do
              changed=true
              # The two generated reference pages are derived from the compiler,
              # so they must retain the full generated-reference check.
              case "$file" in
                workspaces/docs-site/docs/language/reference/language.md|workspaces/docs-site/docs/language/reference/feature_inventory.md)
                  docs_only=false
                  break
                  ;;
                workspaces/docs-site/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$base_ref" HEAD)

            if [ "$changed" = false ]; then
              docs_only=false
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Comment wrapping (comment_width/wrap_comments/format_code_in_doc_comments) requires nightly rustfmt.
      # We intentionally use nightly for *formatting only*; all builds/tests remain on stable/MSRV jobs.
      # Install stable first (rustup), then nightly with retries — nightly channel sync sometimes flakes on the network.
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  rustdoc-gate:
    name: Rustdoc Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          python3 scripts/check_changed_rustdocs.py --base "$base_ref"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse matching stable artifacts without making a pull-request job a shared-cache writer.
          shared-key: incan-stable
          save-if: false
      - uses: ./.github/actions/setup-rust-sccache
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  oven-pr:
    name: Oven PR Gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-stable
            name: ubuntu-latest, stable
            runner: ubuntu-latest
            toolchain: stable
          - id: macos-stable
            name: macos-latest, stable
            runner: macos-latest
            toolchain: stable
          - id: linux-msrv
            name: ubuntu-latest, MSRV 1.93.0
            runner: ubuntu-latest
            toolchain: 1.93.0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ matrix.toolchain }}"
      - name: Restore Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-${{ matrix.toolchain }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock') }}
          restore-keys: |
            incan-oven-pr-sources-v1-${{ matrix.toolchain }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
      - name: Build the compiler
        run: CARGO_BUILD_JOBS=2 cargo build --locked --features lsp --bins
      - uses: ./.github/actions/restore-sdk-provider-store
      - name: Run complete Oven suite
        env:
          INCAN_OVEN_NATIVE_TEST_CASE_TIMINGS: ${{ matrix.id == 'linux-stable' && '1' || '' }}
          INCAN_TEST_OVEN_COMPILER_SUITE_REPORT: ${{ matrix.id == 'linux-stable' && 'target/oven-pr-suite-report.json' || '' }}
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=${{ matrix.toolchain }}
          INCAN_TEST_LOAF_TOOLCHAIN=${{ matrix.toolchain }}
          INCAN_TEST_SUITE_TOOLCHAIN=${{ matrix.toolchain }}
          make -s test-oven
      - name: Upload Linux Oven timing report
        if: matrix.id == 'linux-stable'
        uses: actions/upload-artifact@v6
        with:
          name: oven-pr-linux-stable-timing
          path: target/oven-pr-suite-report.json
          if-no-files-found: error
          retention-days: 1
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          toolchain: nightly-2026-03-24
      - name: Install WASI target for the pinned Loaf baker
        run: rustup target add wasm32-wasip1 --toolchain nightly-2026-03-24
      - name: Bake the release Loafs and guard normal build, run, and test
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=${{ matrix.toolchain }}
          INCAN_TEST_LOAF_TOOLCHAIN=${{ matrix.toolchain }}
          make -s test-oven-release-smoke

  linux-reference-handoff:
    name: Linux reference artifact handoff
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain stable
      - name: Restore Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-stable-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock') }}
          restore-keys: |
            incan-oven-pr-sources-v1-stable-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
      - name: Build Linux compiler and reference generators
        run: |
          CARGO_BUILD_JOBS=2 cargo build --locked --features lsp --bins
          CARGO_BUILD_JOBS=2 cargo build --locked -p incan_core --bin generate_lang_reference
      - name: Run bounded Oven process-containment regressions
        run: make test-oven-pr-regressions
      - name: Prewarm Linux SDK providers for checked references
        run: INCAN_TEST_COMPILER_ALREADY_BUILT=1 make test-prewarm-sdk
      - name: Upload compiler and reference generators
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-tools
          path: |
            target/debug/incan
            target/debug/generate_lang_reference
            target/debug/generate_feature_inventory
          if-no-files-found: error
          retention-days: 1
      - name: Upload SDK provider store
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_test_sdk_provider_store
          if-no-files-found: error
          retention-days: 1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo deny
        run: cargo deny check

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-nightly-toolchain
      - name: Compute udeps cache key
        id: udeps-cache-key
        shell: bash
        run: |
          set -euo pipefail

          workspace_version="$(
            awk '
              /^\[workspace.package\]/ { in_section=1; next }
              /^\[/ { in_section=0 }
              in_section && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$workspace_version" ]; then
            echo "failed to read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi

          release_line="$(
            printf '%s\n' "$workspace_version" |
              sed -E 's/^([0-9]+)\.([0-9]+)\..*$/v\1.\2/'
          )"
          if [ "$release_line" = "$workspace_version" ]; then
            echo "failed to derive release line from workspace version: $workspace_version" >&2
            exit 1
          fi

          key="$(
            {
              rustc +nightly -Vv
              cargo +nightly -V
              printf 'workspace-release-line=%s\n' "$release_line"
              git ls-files 'Cargo.toml' '*/Cargo.toml' 'Cargo.lock' '*/Cargo.lock' | sort | while read -r file; do
                printf '== %s ==\n' "$file"
                WORKSPACE_VERSION="$workspace_version" RELEASE_LINE="$release_line" perl -pe '
                  BEGIN {
                    $from = quotemeta($ENV{"WORKSPACE_VERSION"});
                    $to = $ENV{"RELEASE_LINE"};
                  }
                  s/$from/$to/g;
                ' "$file"
              done
            } | shasum -a 256 | cut -d ' ' -f 1
          )"

          echo "release-line=$release_line" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-udeps
          key: ${{ steps.udeps-cache-key.outputs.key }}
          add-rust-environment-hash-key: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Run cargo udeps
        run: cargo +nightly udeps --all-targets
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  smoke-release:
    name: Smoke Release Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep release-profile artifacts separate from the dev/test cache.
          shared-key: incan-stable-release
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release compiler once
        run: make smoke-test-release

  generate-rust-docs:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Build docs
        run: cargo doc --no-deps
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  docs-site:
    name: Docs Site Build (MkDocs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
      - name: Build docs site (strict)
        run: python -m mkdocs build --strict

  generated-reference:
    name: Generated Reference Up-to-date
    runs-on: ubuntu-latest
    needs:
      - changes
      - oven-pr
      - linux-reference-handoff
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - name: Download matching Incan CLI and checked-reference generators
        uses: actions/download-artifact@v6
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - name: Fingerprint checked feature inventory
        id: inventory-identity
        run: |
          {
            echo "compiler=$(shasum -a 256 target/debug/incan | awk '{print $1}')"
            echo "lock=$(shasum -a 256 Cargo.lock | awk '{print $1}')"
            echo "stdlib=$(git rev-parse HEAD:crates/incan_stdlib/stdlib)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore checked feature inventory providers
        id: inventory-provider-cache
        uses: actions/cache@v4
        with:
          path: target/incan_reference_sdk_provider_store
          key: >-
            incan-feature-inventory-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{
            steps.inventory-identity.outputs.compiler }}-${{ steps.inventory-identity.outputs.lock }}-${{
            steps.inventory-identity.outputs.stdlib }}
      - name: Seed checked feature inventory providers
        if: steps.inventory-provider-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_reference_sdk_provider_store
      - name: Regenerate checked language references
        run: ./target/debug/generate_lang_reference
      - name: Regenerate checked capability inventory
        run: ./target/debug/generate_feature_inventory
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_BIN_EXE_incan: ${{ github.workspace }}/target/debug/incan
          INCAN_SOURCE_ROOT: ${{ github.workspace }}
          INCAN_STDLIB: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_STDLIB_DIR: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_TOOLCHAIN_CRATES_DIR: ${{ github.workspace }}/crates
          INCAN_GENERATED_CARGO_TARGET_DIR: ${{ runner.temp }}/incan_reference_generated_target
          INCAN_INTERNAL_SDK_PROVIDER_STORE: ${{ github.workspace }}/target/incan_reference_sdk_provider_store
      - name: Verify no generated-reference diff
        run: git diff --exit-code workspaces/docs-site/docs/language/reference/language.md workspaces/docs-site/docs/language/reference/feature_inventory.md
