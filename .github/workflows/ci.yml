name: CI

# Steps that run `incan` install the pinned dev.8 release bundle (DEV8_TOOLCHAINS) with Rust 1.98.0 and rustc-dev
# through .github/actions/install-dev8-toolchain (DD-0010); the job fails while no bundle is pinned for its host.

on:
  push:
    branches: [ main, '*.*.*-dev.*', release/** ]
  pull_request:
    branches: [ main, '*.*.*-dev.*', release/** ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INCAN_NO_BANNER: 1

jobs:
  hygiene:
    name: Checkout hygiene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install nightly rustfmt
        uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: make fmt-check
      - name: Install dev.8
        uses: ./.github/actions/install-dev8-toolchain
        with:
          reference: ${{ fromJSON(vars.DEV8_TOOLCHAINS || '{}')['x86_64-unknown-linux-gnu'] }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          incan run scripts/check_changed_rustdocs.incn -- --base "$base_ref"
      - name: Check US English
        run: make us-english-check
      - name: Check the AGENTS.md skill table
        run: make agents-doc-sync-ci
