name: CI

# dev.8 builds and tests the compiler through the Oven with a stage-zero compiler and never runs Cargo. Until a
# stage-zero compiler artifact is published for CI, this workflow runs the checks that read only the checkout.

on:
  push:
    branches: [ main, '*.*.*-dev.*', release/** ]
  pull_request:
    branches: [ main, '*.*.*-dev.*', release/** ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INCAN_NO_BANNER: 1

jobs:
  hygiene:
    name: Checkout hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install nightly rustfmt
        uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: make fmt-check
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          python3 scripts/check_changed_rustdocs.py --base "$base_ref"
      - name: Check US English
        run: make us-english-check
      - name: Check the AGENTS.md skill table
        run: make agents-doc-sync-ci
