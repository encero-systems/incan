name: CI

on:
  push:
    # Match the development-line convention (`<major>.<minor>.<patch>-dev.<n>`) rather than naming one branch, so a
    # new line does not need a workflow edit to get CI. Feature branches keep getting CI through the pull request.
    branches: [ main, '*.*.*-dev.*', release/** ]
  pull_request:
    # `labeled` is here so `full-ci` takes effect on an existing pull request. Without it the label is inert: the
    # default types are opened/synchronize/reopened, so a label only ever reaches the scope step if a run happens to
    # start afterwards. The `changes` job discards any other label immediately, so the auto-labeller does not double
    # every pull request's CI.
    types: [opened, synchronize, reopened, labeled]
    branches: [ main, '*.*.*-dev.*', release/** ]
  workflow_dispatch:
    inputs:
      heavy:
        description: Run the expensive Oven and platform suite regardless of branch
        type: boolean
        default: true
      reference:
        description: Include compiler, SDK, docs and reference checks when heavy is disabled
        type: boolean
        default: false

concurrency:
  # Irrelevant label events skip the scope job, but still enter workflow concurrency. Give them a separate group so
  # auto-labelling cannot cancel the substantive PR run before its tests finish.
  group: ci-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INCAN_NO_BANNER: 1
  INCAN_RUST_TOOLCHAIN: 1.98.0

jobs:
  changes:
    name: CI Scope
    # A label event is only interesting when it is the one that changes the scope. Every other label -- including
    # everything the auto-labeller applies -- skips the whole workflow rather than running it a second time.
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      heavy: ${{ steps.scope.outputs.heavy }}
      reference: ${{ steps.scope.outputs.reference }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Verify the release baseline
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          python3 scripts/test_release_version_consistency.py
          python3 scripts/test_ci_scope.py
          python3 scripts/test_ci_sdk_handoff.py
          python3 scripts/check_release_version_consistency.py \
            --release-branch "$RELEASE_BRANCH" --base-branch "$BASE_BRANCH"
      - name: Classify the pull request
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_HEAVY: ${{ inputs.heavy }}
          DISPATCH_REFERENCE: ${{ inputs.reference }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/ci_scope.sh

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Comment wrapping (comment_width/wrap_comments/format_code_in_doc_comments) requires nightly rustfmt.
      # We intentionally use nightly for *formatting only*; all builds/tests remain on the pinned supported release.
      # Install supported Rust first (rustup), then nightly with retries — nightly channel sync sometimes flakes.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  rustdoc-gate:
    name: Rustdoc Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          python3 scripts/check_changed_rustdocs.py --base "$base_ref"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse matching pinned-toolchain artifacts without making a pull-request job a shared-cache writer.
          shared-key: incan-rust-1.98.0
          save-if: false
      - uses: ./.github/actions/setup-rust-sccache
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # These source-free checks run independently of SDK publication so its consumers never wait for test linking.
      - name: Compile and run SDK transport and CI contract regressions
        run: |
          CARGO_BUILD_JOBS=2 cargo test --locked --all-features --lib sdk_build_reports_
          CARGO_BUILD_JOBS=2 cargo test --locked --all-features --test toolchain_installer_tests compiler_suite_action_composes_baker_guarded_runner_and_storage_evidence -- --exact
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  emitted-symbol-projection:
    name: Recoverable emitted symbols (Rust 1.98.0)
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-emitted-symbol-1.98.0
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prove incan-v1 recovery after v0 mangling and demangling
        run: cargo test --locked --test emitted_symbol_projection_tests -- --nocapture

  oven-platform-smoke:
    name: Platform C ABI gate (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    # No explicit budget: a version bump changes Cargo.lock and misses this job's build cache, and the cache only
    # saves when the job completes, so any budget below a full cold workspace build on a 2-core runner means the job
    # can never re-warm. The runner-level 6-hour ceiling still bounds it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-rust-1-98
            name: macos-latest, Rust 1.98.0
            runner: macos-latest
            toolchain: 1.98.0
            c_abi_test: check_verifies_c_bindings_against_a_declared_ios_interop_target
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ matrix.toolchain }}"
      - name: Restore Cargo sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-${{ matrix.toolchain }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-${{ matrix.toolchain }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Build the compiler
        run: CARGO_BUILD_JOBS=2 cargo build --locked --features lsp --bins
      - uses: ./.github/actions/restore-sdk-provider-store
      # macOS retains its own compiler and SDK because the Linux handoff cannot supply a macOS toolchain.
      - name: Prewarm platform SDK providers
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=${{ matrix.toolchain }}
          make -s test-prewarm-sdk
      - name: Run platform C ABI verification
        run: >-
          CARGO_NET_OFFLINE=true
          cargo test --locked --test cli_integration ${{ matrix.c_abi_test }} -- --exact

  linux-tool-handoff:
    name: Linux compiler and SDK handoff
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.reference == 'true' }}
    # No explicit budget, like oven-platform-smoke: the completion-gated cache must be able to save after a cold
    # workspace build. The runner-level 6-hour ceiling still bounds it.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - name: Restore Cargo sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Build optimized Linux compiler and reference generators
        run: |
          CARGO_BUILD_JOBS=2 cargo build --locked --release --features lsp --bin incan --bin generate_feature_inventory
          CARGO_BUILD_JOBS=2 cargo build --locked --release -p incan_core --bin generate_lang_reference
      - name: Stage exact release tools for SDK preparation and consumers
        run: |
          # Consumers use these stable delivery paths; all three executables were built with the release profile.
          mkdir -p target/debug
          for tool in incan generate_lang_reference generate_feature_inventory; do
            install -m 755 "target/release/$tool" "target/debug/$tool"
            cmp "target/release/$tool" "target/debug/$tool"
            sha256sum "target/release/$tool" "target/debug/$tool"
          done
      # Only this Linux job restores/saves the cross-run SDK cache. Same-run consumers receive an artifact even
      # when another workflow wins the immutable-cache reservation or saving the cache is unavailable.
      - uses: ./.github/actions/restore-sdk-provider-store
      - name: Prepare the selected Linux SDK
        env:
          INCAN_INTERNAL_SDK_BUILD_REPORT_DIR: ${{ runner.temp }}/sdk-build-reports
        run: |
          mkdir -p "$INCAN_INTERNAL_SDK_BUILD_REPORT_DIR"
          INCAN_TEST_COMPILER_ALREADY_BUILT=1 INCAN_TEST_PREWARM_TOOLCHAIN=1.98.0 make -s test-prewarm-sdk
      - name: Stage the exact SDK handoff
        run: >-
          python3 scripts/ci_sdk_handoff.py stage
          --store target/incan_test_sdk_provider_store
          --artifact target/ci-sdk-handoff
      - name: Upload SDK preparation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-sdk-preparation-reports
          path: ${{ runner.temp }}/sdk-build-reports
          if-no-files-found: warn
          retention-days: 7
      - name: Upload selected SDK provider store
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/ci-sdk-handoff
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Upload compiler and reference generators
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-tools
          path: |
            target/debug/incan
            target/debug/generate_lang_reference
            target/debug/generate_feature_inventory
          if-no-files-found: error
          retention-days: 1

  verified-docs:
    name: Verified documentation examples
    runs-on: ubuntu-latest
    needs: [changes, linux-tool-handoff]
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.reference == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler sources
        run: make fetch-locked-cargo-sources
      - name: Download matching compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - uses: ./.github/actions/consume-sdk-provider-store
      - name: Check verified documentation examples
        run: >-
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=1.98.0
          make -s check-docs-examples

  oven-linux-platform-smoke:
    name: Platform C ABI gate (ubuntu-latest, Rust 1.98.0)
    runs-on: ubuntu-latest
    needs: [changes, linux-tool-handoff]
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Download matching compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - uses: ./.github/actions/consume-sdk-provider-store
      # Cargo builds test dependencies and enabled binaries in a separate target so it cannot replace the handoff CLI.
      - name: Run platform C ABI verification
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/incan-platform-test-target
          CARGO_BIN_EXE_incan: ${{ github.workspace }}/target/debug/incan
        run: |
          sha256sum target/debug/incan > "$RUNNER_TEMP/compiler-handoff.sha256"
          cargo test --locked --test cli_integration \
            check_verifies_c_bindings_against_a_declared_android_interop_target -- --exact
          sha256sum --check "$RUNNER_TEMP/compiler-handoff.sha256"

  linux-oven-prewarm:
    name: Linux Oven prewarm
    runs-on: ubuntu-latest
    needs:
      - changes
      - linux-tool-handoff
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    outputs:
      oven_suite_cache_key: ${{ steps.oven-suite-cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Download compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - uses: ./.github/actions/consume-sdk-provider-store
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          toolchain: nightly-2026-03-24
      - name: Install WASI target for the pinned Loaf baker
        run: rustup target add wasm32-wasip1 --toolchain nightly-2026-03-24
      - name: Prewarm the complete Linux Rust 1.98.0 Oven suite
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=1.98.0
          INCAN_TEST_LOAF_TOOLCHAIN=1.98.0
          INCAN_TEST_SUITE_TOOLCHAIN=1.98.0
          make -s test-prewarm-oven-loafs test-prewarm-oven-release-loafs
      - name: Derive immutable prepared-suite cache key
        id: oven-suite-cache-key
        run: echo "key=incan-oven-suite-v1-Linux-X64-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Save prepared Linux Rust 1.98.0 Oven suite
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.oven-suite-cache-key.outputs.key }}
          path: |
            .incan/oven/compiler-libtests-receipt.json
            target/share/incan/oven/loafs
            target/oven-alpha-release-toolchain
            target/oven-compiler-suite-store
            target/incan_test_sdk_provider_store
            target/incan_test_sdk_provider_path

  oven-process-containment:
    name: Oven process-containment regressions
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - name: Restore Cargo sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler sources
        run: make fetch-locked-cargo-sources
      - name: Run bounded Oven process-containment regressions
        run: make test-oven-pr-regressions

  shadow-comparison-evidence:
    # The #1146 source-observable comparison's legacy route runs under Oven, so it needs a published direct-rustc
    # plan. A default test run without one leaves every corpus row honestly non-green, which is indistinguishable
    # from a comparison that was never implemented. This job stages the plan and sets
    # INCAN_SHADOW_REQUIRE_LEGACY_ROUTE=1, so the comparison must actually run, agree, and turn its single corpus
    # row green -- with both route receipts and the Oven authority behind the legacy one.
    name: Shadow comparison evidence (#1146)
    runs-on: ubuntu-latest
    needs:
      - changes
      - linux-tool-handoff
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    # No per-job budget, deliberately: the CI contract test forbids one, because a version bump
    # cold-starts every completion-gated cache and any budget below a cold build means the job can
    # never re-warm. The runner-level six-hour ceiling is the only bound, like every other Oven job.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
      - name: Download compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan
      - uses: ./.github/actions/consume-sdk-provider-store
      # Cargo builds test dependencies in a separate target so it cannot replace the handoff CLI. The Makefile's
      # own `TARGET_DIR` defaults to `CARGO_TARGET_DIR`, so it has to be told where the handoff binary actually
      # is -- the same compensation the platform ABI job makes with `CARGO_BIN_EXE_incan`. Without it the recipe
      # looks for the compiler in the empty scratch target and the lane cannot pass at all.
      - name: Prove the source-observable comparison ran and agreed
        env:
          CARGO_NET_OFFLINE: "true"
          CARGO_TARGET_DIR: ${{ runner.temp }}/incan-shadow-test-target
          INCAN_TEST_COMPILER_ALREADY_BUILT: "1"
        run: |
          sha256sum target/debug/incan > "$RUNNER_TEMP/compiler-handoff.sha256"
          make -s shadow-comparison-evidence TARGET_DIR="$GITHUB_WORKSPACE/target"
          sha256sum --check "$RUNNER_TEMP/compiler-handoff.sha256"
      # The corpus summary follows `CARGO_TARGET_DIR`, not the Makefile's `TARGET_DIR`, because the test writes it
      # from inside the cargo run. It therefore lands in the scratch target above.
      - name: Upload the parity corpus summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shadow-comparison-parity-summary
          path: ${{ runner.temp }}/incan-shadow-test-target/parity-corpus/summary.json
          if-no-files-found: warn

  oven-linux-replay:
    name: Oven Linux replay (${{ matrix.display }}/4)
    runs-on: ubuntu-latest
    needs:
      - changes
      - linux-oven-prewarm
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    strategy:
      fail-fast: false
      # `partition` is the 0-based index the Makefile and artifact names consume; `display` exists only because
      # GitHub expressions cannot compute `partition + 1` for a human-facing 1-based job name.
      matrix:
        include:
          - { partition: 0, display: 1 }
          - { partition: 1, display: 2 }
          - { partition: 2, display: 3 }
          - { partition: 3, display: 4 }
    steps:
      # The replayed compiler suite includes the frozen v0.5 capability snapshot check, which resolves the `v0.5.0`
      # tag in this checkout; a tagless shallow clone fails that shard rather than the code under test.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          toolchain: nightly-2026-03-24
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Download prewarmed compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - name: Restore immutable prepared Oven suite
        uses: actions/cache/restore@v5
        with:
          key: ${{ needs.linux-oven-prewarm.outputs.oven_suite_cache_key }}
          path: |
            .incan/oven/compiler-libtests-receipt.json
            target/share/incan/oven/loafs
            target/oven-alpha-release-toolchain
            target/oven-compiler-suite-store
            target/incan_test_sdk_provider_store
            target/incan_test_sdk_provider_path
          fail-on-cache-miss: true
      - name: Verify prepared suite handoff
        run: |
          test -s .incan/oven/compiler-libtests-receipt.json
          test -d target/share/incan/oven/loafs
          test -x target/oven-alpha-release-toolchain/bin/incan
          test -d target/oven-alpha-release-toolchain/share/incan/oven/loafs
          test -d target/oven-compiler-suite-store
          test -s target/incan_test_sdk_provider_path
      - name: Run receipt-bound Oven partition
        env:
          INCAN_TEST_COMMAND_TIMINGS: '1'
          INCAN_TEST_OVEN_COMPILER_SUITE_REPORT: target/oven-pr-linux-partition-${{ matrix.partition }}.json
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=1.98.0
          INCAN_TEST_LOAF_TOOLCHAIN=1.98.0
          INCAN_TEST_SUITE_TOOLCHAIN=1.98.0
          make -s test-oven-partition
          INCAN_TEST_OVEN_PARTITION_INDEX=${{ matrix.partition }}
          INCAN_TEST_OVEN_PARTITION_COUNT=4
      # Every partition retains measured root/case durations for future replay weighting (#1065). Consumption is
      # separate work; publishing these records does not mean this run's partitioner already uses them.
      - name: Upload Oven partition report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oven-pr-linux-partition-${{ matrix.partition }}
          path: |
            target/oven-pr-linux-partition-${{ matrix.partition }}.json
            target/oven-pr-linux-partition-${{ matrix.partition }}.json.wall-time.json
          if-no-files-found: warn
          retention-days: 30
      # Successful diagnostic output stays out of live progress but remains available with failed-case diagnostics.
      - name: Upload Oven partition transcripts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oven-pr-linux-partition-${{ matrix.partition }}-transcripts
          path: target/oven-pr-linux-partition-${{ matrix.partition }}.json.transcripts.tar.gz
          if-no-files-found: warn
          retention-days: 7
      - name: Upload retained caller transcripts after a failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: oven-pr-linux-partition-${{ matrix.partition }}-raw-transcripts
          path: target/oven-compiler-suite-output.*/shards/**/*.libtest-output.txt
          if-no-files-found: warn
          retention-days: 7

  oven-release-smoke:
    name: Oven release Loaf guard
    runs-on: ubuntu-latest
    needs:
      - changes
      - linux-tool-handoff
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1 --toolchain "${{ env.INCAN_RUST_TOOLCHAIN }}"
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          toolchain: nightly-2026-03-24
      - name: Install WASI target for the pinned Loaf baker
        run: rustup target add wasm32-wasip1 --toolchain nightly-2026-03-24
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-oven-pr-sources-v1-1.98.0-Linux-X64-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_loaf_dependencies/Cargo.lock', 'src/oven/fixtures/release_stdlib.toml') }}
          restore-keys: |
            incan-oven-pr-sources-v1-1.98.0-Linux-X64-
      - name: Fetch locked compiler and Loaf publisher sources
        run: |
          make fetch-locked-cargo-sources
          make fetch-oven-loaf-sources
          make fetch-release-support-workspace-sources
      - name: Download prewarmed compiler and reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - uses: ./.github/actions/consume-sdk-provider-store
      - name: Bake the release Loafs and guard normal build, run, and test
        run: >-
          CARGO_NET_OFFLINE=true
          INCAN_TEST_COMPILER_ALREADY_BUILT=1
          INCAN_TEST_PREWARM_TOOLCHAIN=1.98.0
          INCAN_TEST_LOAF_TOOLCHAIN=1.98.0
          make -s test-oven-release-smoke

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo deny
        run: cargo deny check

  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: ./.github/actions/install-nightly-toolchain
      - name: Compute udeps cache key
        id: udeps-cache-key
        shell: bash
        run: |
          set -euo pipefail

          workspace_version="$(
            awk '
              /^\[workspace.package\]/ { in_section=1; next }
              /^\[/ { in_section=0 }
              in_section && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$workspace_version" ]; then
            echo "failed to read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi

          release_line="$(
            printf '%s\n' "$workspace_version" |
              sed -E 's/^([0-9]+)\.([0-9]+)\..*$/v\1.\2/'
          )"
          if [ "$release_line" = "$workspace_version" ]; then
            echo "failed to derive release line from workspace version: $workspace_version" >&2
            exit 1
          fi

          key="$(
            {
              rustc +nightly -Vv
              cargo +nightly -V
              printf 'workspace-release-line=%s\n' "$release_line"
              git ls-files 'Cargo.toml' '*/Cargo.toml' 'Cargo.lock' '*/Cargo.lock' | sort | while read -r file; do
                printf '== %s ==\n' "$file"
                WORKSPACE_VERSION="$workspace_version" RELEASE_LINE="$release_line" perl -pe '
                  BEGIN {
                    $from = quotemeta($ENV{"WORKSPACE_VERSION"});
                    $to = $ENV{"RELEASE_LINE"};
                  }
                  s/$from/$to/g;
                ' "$file"
              done
            } | shasum -a 256 | cut -d ' ' -f 1
          )"

          echo "release-line=$release_line" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-udeps
          key: ${{ steps.udeps-cache-key.outputs.key }}
          add-rust-environment-hash-key: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Run cargo udeps
        run: cargo +nightly udeps --all-targets
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  smoke-release:
    name: Smoke Release Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.heavy == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep release-profile artifacts separate from the dev/test cache.
          shared-key: incan-rust-1.98.0-release
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release compiler once
        run: make smoke-test-release

  generate-rust-docs:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Build docs
        run: cargo doc --no-deps
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  docs-site:
    name: Docs Site Build (MkDocs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
      - name: Build docs site (strict)
        run: make docs-build

  generated-reference:
    name: Generated Reference Up-to-date
    runs-on: ubuntu-latest
    # Reference generation consumes the compiler/SDK handoff directly; no Loaf baking is needed.
    needs:
      - changes
      - linux-tool-handoff
    if: ${{ needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.reference == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.INCAN_RUST_TOOLCHAIN }}
      - name: Restore Cargo sources
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-1.98.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-1.98.0-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - name: Download matching Incan CLI and checked-reference generators
        uses: actions/download-artifact@v7
        with:
          name: test-linux-tools
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - uses: ./.github/actions/consume-sdk-provider-store
        with:
          store: target/incan_reference_sdk_provider_store
      - name: Regenerate checked language references
        run: ./target/debug/generate_lang_reference
      - name: Regenerate checked capability inventory
        run: ./target/debug/generate_feature_inventory
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_BIN_EXE_incan: ${{ github.workspace }}/target/debug/incan
          INCAN_SOURCE_ROOT: ${{ github.workspace }}
          INCAN_STDLIB: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_STDLIB_DIR: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_TOOLCHAIN_CRATES_DIR: ${{ github.workspace }}/crates
          INCAN_GENERATED_CARGO_TARGET_DIR: ${{ runner.temp }}/incan_reference_generated_target
          INCAN_INTERNAL_SDK_PROVIDER_STORE: ${{ github.workspace }}/target/incan_reference_sdk_provider_store
      - name: Verify no generated-reference diff
        run: git diff --exit-code workspaces/docs-site/docs/language/reference/language.md workspaces/docs-site/docs/language/reference/feature_inventory.md
