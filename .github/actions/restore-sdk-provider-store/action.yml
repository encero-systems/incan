name: Restore compiled SDK provider store
description: Reuse an immutable SDK provider store for the compiler-owned source closure and selected Rust toolchain.
runs:
  using: composite
  steps:
    - name: Fingerprint provider inputs
      id: identity
      shell: bash
      run: |
        provider_identity="$(INCAN_NO_BANNER=1 target/debug/incan oven sdk-provider-store-identity --compiler-root .)"
        rustc_identity="$(rustc --version --verbose | shasum -a 256 | awk '{print $1}')"
        printf 'provider_identity=%s\n' "$provider_identity" >> "$GITHUB_OUTPUT"
        printf 'rustc_identity=%s\n' "$rustc_identity" >> "$GITHUB_OUTPUT"
    - name: Restore and save compiled SDK provider store
      # The compiler independently validates the content-addressed store. The cache accelerates an exact match but
      # never becomes the authority for provider compatibility.
      uses: actions/cache@v4
      with:
        path: target/incan_test_sdk_provider_store
        key: >-
          incan-sdk-provider-v3-${{ runner.os }}-${{ runner.arch }}-${{
          steps.identity.outputs.provider_identity }}-${{ steps.identity.outputs.rustc_identity }}
